name: eye
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+2
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.5.2
  path_provider: ^2.1.5
  path: ^1.9.1
  hive_flutter: ^1.1.0
  collection: ^1.19.0
  pocketbase: ^0.25.0
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  objectbox: ^6.0.0-preview.4
  objectbox_flutter_libs: ^6.0.0-preview.4
  crypto: ^3.0.6
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
dev_dependencies:
  build_runner: ^2.4.15
  objectbox_generator: ^6.0.0-preview.4
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon_1024.png
  adaptive_icon_background: "#E4EAF6"
  adaptive_icon_foreground: assets/branding/app_icon_foreground_1024.png
  min_sdk_android: 21
